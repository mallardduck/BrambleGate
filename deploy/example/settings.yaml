# Example BrambleDNS settings.yaml.
# Mount this at /config/settings.yaml (see docs/architecture.md volume layout).
# Full schema reference: docs/config-schema.md. Records live in records.yaml.

# Mirror your real network VLANs here (BrambleDNS is not the authority for VLANs —
# your network gear is). Names are referenced by per-VLAN record overrides; the
# client's source subnet selects which VLAN's answer it gets. Each VLAN may list
# multiple CIDRs.
vlans:
  - name: trusted
    cidrs: [192.168.10.0/24]
  - name: untrusted-wifi
    cidrs: [192.168.30.0/24]

upstream_dns:
  # host:port of your existing ad-block resolver (PiHole/Technitium/AdGuard Home).
  # Nothing about this is compiled in — it is read from this file at startup.
  address: 192.168.10.5:53
  protocol: plain # plain | dot

listeners:
  plain:
    enabled: true
    port: 53
  dot:
    enabled: true
    port: 853

acme:
  # When disabled, encrypted listeners use a self-signed cert (fine for testing;
  # rejected by strict clients like Android). Enable to obtain a real cert via
  # ACME DNS-01 — no inbound exposure needed. See docs/certificates.md.
  enabled: false
  domain: dns.example.com   # a real, owned domain; its A record may point at a LAN IP
  email: you@example.com
  dns_provider: cloudflare  # supported names + required env vars: docs/certificates.md
  production: false         # default = LE staging (untrusted) until you opt in
  renew_before_days: 30
  # Credentials come from environment variables, never this file
  # (e.g. CLOUDFLARE_DNS_API_TOKEN).