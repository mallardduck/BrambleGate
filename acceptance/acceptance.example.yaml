# Copy to acceptance.yaml and fill in your real network. See README.md.
#
# Only genuinely undiscoverable info lives here: how to reach the instance
# under test, the zone under test, and true test expectations (a VLAN's
# expected split-horizon answer, an external comparison domain). VLAN
# identity, the upstream resolver address, hosts.yaml entries, and
# mdns-linked records are discovered live from the instance's own /api/*
# (see ../discover/discover.go) rather than duplicated here.

target:
  api_base: https://192.168.1.164:8443
  dns_addr: 192.168.1.164

domain: dns.example.com

vlans:
  - name: trusted
    expect_value: 192.168.1.164
  - name: guest
    expect_nxdomain: true

upstream:
  test_domain: example.com

mobile:
  enabled: false
