name: Dev image

# Rolling "head" image: rebuilds and pushes `dev` once CI (ci.yml) has fully
# passed on main. Triggered by CI's completion (workflow_run) rather than
# reusing ci.yml as a job, so CI runs exactly once per push to main instead
# of once standalone and once again here. This gives a moving preview tag to
# track HEAD without cutting a real release — no goreleaser, no GitHub
# release, no draft/undraft. See release.yml for the tagged-release path.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

env:
  # GHCR path is lowercase-only; the module is github.com/mallardduck/BrambleGate.
  IMAGE: ghcr.io/mallardduck/bramblegate

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry
    steps:
      # Pin to the exact commit CI validated: workflow_run's default ref/sha
      # is the branch tip at trigger time, which can have moved past the
      # commit that actually finished CI if another push landed in between.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # QEMU lets a single amd64 runner emit arm64 layers; buildx drives the
      # multi-platform build into one manifest (same as release.yml's image job).
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        id: build_date
        run: echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Short sha computed explicitly from workflow_run.head_sha rather than
      # metadata-action's default `type=sha` (which reads github.sha) since
      # that context value isn't guaranteed to match head_sha for this event.
      - name: Set short sha
        id: short_sha
        run: echo "SHA=${GITHUB_EVENT_HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      # `dev` is the rolling tag every push to main overwrites; `sha-<short>`
      # stays pinned to this exact build so a specific commit's image is
      # still pullable after the next merge moves `dev` on.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=raw,value=sha-${{ steps.short_sha.outputs.SHA }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keep the debug shell, same as prerelease images, since this is
          # never the stable/minimal release artifact.
          build-args: |
            VARIANT=debug
            VERSION=dev-${{ github.event.workflow_run.head_sha }}
            GIT_COMMIT=${{ github.event.workflow_run.head_sha }}
            BUILD_DATE=${{ steps.build_date.outputs.DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max