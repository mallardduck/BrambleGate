name: Release

# Multi-arch image build + goreleaser binaries, run in parallel on a pushed
# version tag (e.g. v0.1.0) and on manual dispatch. goreleaser (.goreleaser.yaml)
# creates the GitHub release as a draft; once both the image and goreleaser
# jobs succeed, `undraft` flips it live. Docker produces a single multi-platform
# manifest for linux/amd64 (x86 servers) and linux/arm64 (Raspberry Pi and
# friends) — the two targets a homelab actually runs on. No CGO is used, so
# cross-compiling both arches from one builder is cheap (see
# docs/repo-layout.md "Docker build notes").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # GHCR path is lowercase-only; the module is github.com/mallardduck/BrambleGate.
  IMAGE: ghcr.io/mallardduck/bramblegate

jobs:
  goreleaser:
    # workflow_dispatch has no tag for goreleaser to release under.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the draft GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so goreleaser can build the changelog

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # .goreleaser.yaml has `release: draft: true` — this only publishes
      # binaries/checksums/changelog to a draft release. `undraft` below flips
      # it live once this and the image build both succeed.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU lets a single amd64 runner emit arm64 layers; buildx drives the
      # multi-platform build into one manifest.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags/labels from the git ref: the version tag, a rolling
      # major.minor, and (for the default branch) latest.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          # workflow_dispatch has no tag to publish under, so only push for real
          # tag builds; a manual run still exercises the full multi-arch build.
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  undraft:
    # Only real tag pushes produce a goreleaser draft release to undraft;
    # workflow_dispatch has no tag and no release.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [goreleaser, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # flip the draft release live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check semver
        id: semver
        run: .github/scripts/check-semver.sh "${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      # A prerelease tag (e.g. v1.2.3-beta) is flagged --prerelease and never
      # marked --latest; a stable tag is undrafted as the new latest release.
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.semver.outputs.HAS_PRERELEASE }}" == "true" ]]; then
            gh release edit "${{ github.ref_name }}" --draft=false --prerelease --latest=false --repo "${{ github.repository }}"
          else
            gh release edit "${{ github.ref_name }}" --draft=false --prerelease=false --latest=true --repo "${{ github.repository }}"
          fi
