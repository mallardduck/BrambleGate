version: 2

project_name: bramblegate

# The root module resolves its sibling library modules (engine/, plugins/*,
# model/, store/, configgen/) via committed `replace` directives, not
# go.work — same rationale as .github/workflows/ci.yml.
builds:
  - id: bramblegate
    main: .
    binary: bramblegate
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats: [tar.gz]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  # left at the default (false): --release-notes is the only thing that
  # should ever populate the body, but `disable: true` makes goreleaser
  # ignore --release-notes too and render an empty changelog instead.
  disable: false

release:
  draft: true
